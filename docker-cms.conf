<VirtualHost *:80>
    DocumentRoot /var/www/html/misc/cms/public

    <Directory /var/www/html/misc/cms/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
