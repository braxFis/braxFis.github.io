<VirtualHost *:80>
    DocumentRoot /var/www/html/misc/cms/public
    <Directory /var/www/html/misc/cms/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /index.php
    </Directory>

    Alias /misc/css/ /var/www/html/misc/css/
    Alias /misc/js/ /var/www/html/misc/js/
    Alias /misc/img/ /var/www/html/misc/img/
    Alias /misc/favicon.ico /var/www/html/misc/favicon.ico
    Alias /misc/icon.svg /var/www/html/misc/icon.svg
    Alias /misc/icon.png /var/www/html/misc/icon.png
    <Directory /var/www/html/misc>
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>

    <Directory /var/www/html/misc/cms/public/uploads>
        <FilesMatch "(?i)\\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
